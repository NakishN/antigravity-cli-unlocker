name: Release Workflows & Binary Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Standalone Releases (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: antigravity-unlock-linux-x86_64
            asset_name: antigravity-unlock-linux-x86_64
          - os: windows-latest
            artifact_name: antigravity-unlock-windows-x64.exe
            asset_name: antigravity-unlock.exe
          - os: macos-latest
            artifact_name: antigravity-unlock-macos-universal
            asset_name: antigravity-unlock-macos

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & package
        run: |
          python -m pip install --upgrade pip setuptools pytest pyinstaller
          python -m pip install -e .

      - name: Install AppImage build tools on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Run test suite
        run: |
          python -m pytest

      - name: Build Standalone Binary with PyInstaller
        run: |
          python packaging/build_binaries.py

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          chmod +x packaging/build_appimage.sh
          ./packaging/build_appimage.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  create-github-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist_all

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_all/*/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
