name: Release Workflows & Binary Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Standalone Releases (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: antigravity-unlock-linux-x86_64
            artifact_paths: |
              dist/antigravity-unlock-linux-x86_64
              dist/Antigravity_Unlocker-x86_64.AppImage
          - os: windows-latest
            artifact_name: antigravity-unlock-windows-x64.exe
            artifact_paths: dist/antigravity-unlock-windows-x64.exe
          - os: macos-latest
            artifact_name: antigravity-unlock-macos-universal
            artifact_paths: dist/antigravity-unlock-macos-universal

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & package
        run: |
          python -m pip install --upgrade pip setuptools pytest pyinstaller
          python -m pip install -e .

      - name: Install AppImage build tools on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Run test suite
        run: |
          python -m pytest

      - name: Build Standalone Binary with PyInstaller
        run: |
          python packaging/build_binaries.py

      # The repository used to track old dist/ files.  Without this check a
      # stale binary could be uploaded under the new tag - exactly what happened
      # to v1.6.0, whose AppImage was still v1.2.1.
      - name: Verify binary version
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   BIN="dist/antigravity-unlock-linux-x86_64" ;;
            Windows) BIN="dist/antigravity-unlock-windows-x64.exe" ;;
            macOS)   BIN="dist/antigravity-unlock-macos-universal" ;;
          esac
          chmod +x "$BIN" 2>/dev/null || true
          "$BIN" --version
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            "$BIN" --version | grep -q "${GITHUB_REF_NAME#v}"
          fi

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          chmod +x packaging/build_appimage.sh
          ./packaging/build_appimage.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  create-github-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      # The CHANGELOG is the source of truth for release notes, so the release
      # body is the matching section rather than a hand-copied duplicate that
      # drifts.  `awk` cuts from the `## [<tag-without-v>]` heading up to the
      # next `## [` heading; if the section is missing the file stays empty and
      # the release is still created, just without notes.
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 == "## [" ver "]" || index($0, "## [" ver "] - ") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::warning::No CHANGELOG section found for [$VERSION]; releasing without notes"
            echo "Release $VERSION." > RELEASE_NOTES.md
          else
            echo "Extracted $(wc -l < RELEASE_NOTES.md) lines of notes for [$VERSION]"
          fi

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
