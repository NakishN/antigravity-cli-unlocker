name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Verify Python Code Syntax
        run: |
          python -m py_compile antigravity_unlock.py
          
      - name: ShellCheck Bash Script
        uses: ludeeus/action-shellcheck@master
        with:
          scans: 'antigravity_unlock_linux.sh'
