[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-cli-unlocker"
version = "1.2.1"
description = "Cross-Platform Split-Tunnel Proxy, Multi-Strategy Patcher & Autostart Guardian for Google Antigravity CLI (agy)"
readme = "README.md"
authors = [{ name = "NakishN" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "cryptography>=3.4",
]

[project.optional-dependencies]
watchdog = ["watchdog>=2.1.0"]

[project.scripts]
antigravity-unlock = "antigravity_unlock.cli:main"

[tool.setuptools.packages.find]
include = ["antigravity_unlock*"]

[tool.setuptools.package-data]
antigravity_unlock = ["*.json"]
